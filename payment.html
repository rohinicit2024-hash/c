<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Process Payment - Credit Card Processing System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="guarded" data-page="payment">

  <header class="topbar">
    <div class="brand"><span class="brand-mark">CC</span> Credit Card Processing System</div>
    <div class="topbar-right">
      <span class="topbar-user">Signed in as <strong class="js-customer-name"></strong></span>
      <button type="button" class="btn btn-light btn-small js-logout">Logout</button>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Process Payment</h1>
        <p>Available credit: <strong id="availableCredit">-</strong></p>
      </div>
      <a class="btn btn-outline" href="dashboard.html">Back to Dashboard</a>
    </div>

    <div id="paymentMsg" class="alert hidden" role="alert"></div>

    <form id="paymentForm" class="panel-box" novalidate>
      <div class="form-grid">
        <div class="field full">
          <label for="payAmount">Payment amount (INR)</label>
          <input type="number" id="payAmount" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required>
        </div>

        <div class="field full">
          <label for="payHolder">Name on card</label>
          <input type="text" id="payHolder" autocomplete="off" required>
        </div>

        <div class="field full">
          <label for="payCardNumber">Card number</label>
          <input type="text" id="payCardNumber" inputmode="numeric" maxlength="19" autocomplete="off" placeholder="1234 5678 9012 3456" required>
        </div>

        <div class="field">
          <label for="payExpiry">Expiry (MM/YY)</label>
          <input type="text" id="payExpiry" inputmode="numeric" maxlength="5" autocomplete="off" placeholder="MM/YY" required>
        </div>
        <div class="field">
          <label for="payCvv">CVV</label>
          <input type="password" id="payCvv" inputmode="numeric" maxlength="4" autocomplete="off" required>
        </div>

        <!-- Payment password: script.js changes these labels depending on whether
             the customer has already created a payment password -->
        <div class="field full" id="payPasswordHelp">
          <div class="alert alert-info" id="payPasswordNote" style="margin:0"></div>
        </div>
        <div class="field">
          <label for="payPassword" id="payPasswordLabel">Payment password</label>
          <input type="password" id="payPassword" autocomplete="new-password" required>
        </div>
        <div class="field" id="payConfirmField">
          <label for="payPasswordConfirm">Confirm payment password</label>
          <input type="password" id="payPasswordConfirm" autocomplete="new-password">
        </div>
      </div>

      <div class="btn-row">
        <button type="submit" class="btn">Pay Now</button>
        <a class="btn btn-outline" href="transaction.html">Transaction History</a>
      </div>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
